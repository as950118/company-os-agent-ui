[project]
name = "company-os-agent-ui"
version = "0.1.0"
description = "Local web control panel + live PM/Architect/Backend agent pilot for company-os-cli instances"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "as950118" }]
keywords = ["company-os", "fastapi", "web", "control-panel", "agent", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "company-os-cli>=0.3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/as950118/company-os-agent-ui"
Repository = "https://github.com/as950118/company-os-agent-ui"
Issues = "https://github.com/as950118/company-os-agent-ui/issues"

[project.scripts]
company-os-agent-ui = "company_os_agent_ui.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_os_agent_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "src/company_os_agent_ui/**",
    "tests/**",
    "README.md",
    "LICENSE",
]
