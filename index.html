function formatTime(min) {
  const h = Math.floor(min / 60).toString().padStart(2, '0');
  const m = Math.floor(min % 60).toString().padStart(2, '0');
  return `${h}:${m}`;
}

async function callClaudeAPI(apiKey, prompt, schema) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-5',
      max_tokens: 1024,
      output_config: { effort: 'low', format: { type: 'json_schema', schema } },
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`API 오류 ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error('응답에서 텍스트 블록을 찾을 수 없습니다.');
  return JSON.parse(textBlock.text);
}

async function generateDialogueLines(apiKey, projectName, topicLabel, speakerIds) {
  const speakers = speakerIds.map(id => AGENT_BY_ID[id]);
  if (apiKey) {
    try {
      const prompt = `당신은 한국 IT 스타트업의 사내 회의 대화를 생성하는 시뮬레이터입니다.\n프로젝트명: "${projectName}"\n회의 주제: ${topicLabel}\n참여자: ${speakers.map(s => `${s.name}(${s.role}, ${TEAMS[s.team].name})`).join(', ')}\n각 참여자가 정확히 한 번씩, 자신의 역할에 맞는 업무 맥락의 짧은 대사(1~2문장, 한국어 구어체)를 순서대로 말하는 회의 대화를 만들어주세요.`;
      const schema = {
        type: 'object',
        properties: { lines: { type: 'array', items: { type: 'object', properties: { speaker: { type: 'string' }, text: { type: 'string' } }, required: ['speaker', 'text'], additionalProperties: false } } },
        required: ['lines'], additionalProperties: false,
      };
      const data = await callClaudeAPI(apiKey, prompt, schema);
      if (data && Array.isArray(data.lines) && data.lines.length > 0) return data.lines;
    } catch (err) {
      console.warn('AI 대화 생성 실패, 템플릿으로 대체합니다.', err);
    }
  }
  const key = topicLabel.includes('디자인') ? 'design' : topicLabel.includes('마케팅') ? 'marketing' : 'morning';
  return speakerIds.map(id => {
    const agent = AGENT_BY_ID[id];
    const options = (DIALOGUE_TEMPLATES[key] && DIALOGUE_TEMPLATES[key][id]) || [`${agent.role} 관점에서 논의를 이어가겠습니다.`];
    const line = options[Math.floor(Math.random() * options.length)];
    return { speaker: agent.name, text: line.replace('{project}', projectName) };
  });
}

async function generateOutputForStage(apiKey, projectName, stageName) {
  if (apiKey) {
    try {
      const prompt = `당신은 한국 IT 회사의 ${stageName}팀입니다.\n프로젝트명: "${projectName}"\n${stageName} 단계의 업무 결과물을 실제 사내 문서처럼 구체적으로 작성해주세요.`;
      const schema = {
        type: 'object',
        properties: { title: { type: 'string' }, summary: { type: 'string' }, details: { type: 'string' } },
        required: ['title', 'summary', 'details'], additionalProperties: false,
      };
      const data = await callClaudeAPI(apiKey, prompt, schema);
      if (data && data.title) return data;
    } catch (err) {
      console.warn('AI 결과물 생성 실패, 템플릿으로 대체합니다.', err);
    }
  }
  const options = OUTPUT_TEMPLATES[stageName] || [{ title: `${stageName} 결과물`, summary: '', details: '' }];
  return options[Math.floor(Math.random() * options.length)];
}

        {/* 에이전트 */}
        {AGENTS.map(agent => (

                       isSelected={selectedAgentId === agent.id} onClick={onSelectAgent} />

      {/* 범례 */}

}

const REAL_REPORT_URL = 'https://raw.githubusercontent.com/as950118/auto-trade/main/reports/latest.json';

function App() {
  const [projectName, setProjectName] = useState('신규 콘텐츠 캠페인');
  const [apiKey, setApiKey] = useState(() => localStorage.getItem('office_sim_api_key') || '');
  const [showApiKeyInput, setShowApiKeyInput] = useState(false);

  const [realReport, setRealReport] = useState(null);
  const [realReportLoading, setRealReportLoading] = useState(false);
  const [realReportError, setRealReportError] = useState(null);

  const loadRealReport = useCallback(async () => {
    setRealReportLoading(true);
    setRealReportError(null);
    try {
      const res = await fetch(`${REAL_REPORT_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) {
        throw new Error(
          res.status === 404
            ? '아직 리포트가 없습니다. 일일 자동 점검 루틴이 아직 실행되지 않았을 수 있어요.'
            : `리포트 요청 실패 (HTTP ${res.status})`
        );
      }
      const data = await res.json();
      setRealReport(data);
    } catch (err) {
      setRealReportError(err.message || '리포트를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.');
    } finally {
      setRealReportLoading(false);
    }
  }, []);

  const [simTime, setSimTime] = useState(540);
  const [isRunning, setIsRunning] = useState(false);
  const [speed, setSpeed] = useState(5);

  const [agentStates, setAgentStates] = useState(initialAgentStates);
  const [logs, setLogs] = useState([]);
  const [meeting, setMeeting] = useState(null);
  const [project, setProject] = useState({ name: projectName, stage: null, outputs: {} });
  const [selectedAgentId, setSelectedAgentId] = useState(null);

  const triggeredRef = useRef(new Set());

  useEffect(() => { localStorage.setItem('office_sim_api_key', apiKey); }, [apiKey]);

  const addLog = useCallback((time, text) => {
    setLogs(prev => [...prev, { id: nextLogId(), time: formatTime(time), text }]);
  }, []);

  const moveAll = useCallback((ids, posFn, status) => {
    setAgentStates(prev => {
      const next = { ...prev };
      ids.forEach((id, idx) => { next[id] = { status, pos: posFn(id, idx) }; });
      return next;
    });
  }, []);

  const runMeeting = useCallback((topic, participantIds) => {
    setMeeting({ topic, participants: participantIds, dialogue: [], generating: true });
    generateDialogueLines(apiKey, projectName, topic, participantIds)
      .then(lines => setMeeting(m => (m ? { ...m, dialogue: lines, generating: false } : m)))
      .catch(() => setMeeting(m => (m ? { ...m, generating: false } : m)));
  }, [apiKey, projectName]);

  const startStage = useCallback((stageName, time) => {
    setProject(prev => ({ ...prev, stage: stageName }));
    addLog(time, `🚀 ${TEAMS[STAGE_TEAM[stageName]].name}이(가) '${stageName}' 단계 작업을 시작합니다.`);
    generateOutputForStage(apiKey, projectName, stageName).then(output => {
      setProject(prev => ({ ...prev, outputs: { ...prev.outputs, [stageName]: output } }));
      addLog(time, `📄 [${stageName}] 결과물이 등록되었습니다 → "${output.title}"`);
    }).catch(() => {});
  }, [apiKey, projectName, addLog]);

  const handleEvent = useCallback((evt) => {
    switch (evt.type) {
      case 'arrival':
        moveAll(AGENT_IDS, id => DESKS[id], 'idle');
        addLog(evt.time, '🏢 전 직원이 출근하여 각자의 자리에 착석했습니다.');
        break;
      case 'meeting_start':
        moveAll(AGENT_IDS, (id, idx) => MEETING_SEATS[idx], 'meeting');
        addLog(evt.time, '📋 아침 회의가 시작되었습니다. 전 직원이 회의실에 모였습니다.');
        runMeeting('아침 회의 - 오늘의 목표 공유', MORNING_SPEAKERS);
        break;
      case 'meeting_end_stage':
        moveAll(AGENT_IDS, id => DESKS[id], 'working');
        setMeeting(null);
        addLog(evt.time, '✅ 아침 회의를 마치고 각 팀이 업무를 시작합니다.');
        startStage(evt.stage, evt.time);
        break;
      case 'lunch_start':
        moveAll(AGENT_IDS, (id, idx) => LUNCH_SEATS[idx], 'lunch');
        addLog(evt.time, '🍚 점심시간입니다. 모두 휴게실로 이동했습니다.');
        break;
      case 'lunch_end_stage':
        moveAll(AGENT_IDS, id => DESKS[id], 'working');
        addLog(evt.time, '💼 점심시간이 끝나고 오후 업무를 재개합니다.');
        startStage(evt.stage, evt.time);
        break;
      case 'collab_start': {
        const ids = COLLAB_PARTICIPANTS[evt.collab];
        moveAll(ids, (id, idx) => MEETING_SEATS[idx], 'meeting');
        const label = evt.collab === 'design' ? '디자인팀-개발팀 협업 회의' : '마케팅 실행 협업 회의';
        addLog(evt.time, `🤝 ${label}가 시작되었습니다.`);
        runMeeting(label, ids);
        break;
      }
      case 'collab_end_stage': {
        const ids = COLLAB_PARTICIPANTS[evt.collab];
        moveAll(ids, id => DESKS[id], 'working');
        setMeeting(null);
        addLog(evt.time, '✅ 협업 회의를 마쳤습니다.');
        startStage(evt.stage, evt.time);
        break;
      }
      case 'stage_start':
        startStage(evt.stage, evt.time);
        break;
      case 'final':
        setProject(prev => ({ ...prev, stage: '완료' }));
        addLog(evt.time, '🎉 모든 단계가 완료되어 최종 결과물이 완성되었습니다!');
        break;
      case 'departure':
        moveAll(AGENT_IDS, id => DESKS[id], 'left');
        addLog(evt.time, '🌙 하루 업무를 마치고 모두 퇴근했습니다. 수고하셨습니다!');
        break;
      default:
        break;
    }
  }, [moveAll, addLog, runMeeting, startStage]);

  // 시간 진행 타이머
  useEffect(() => {
    if (!isRunning) return;
    const timer = setInterval(() => {
      setSimTime(t => Math.min(t + speed, 1080));
    }, 1000);
    return () => clearInterval(timer);
  }, [isRunning, speed]);

  useEffect(() => { if (simTime >= 1080) setIsRunning(false); }, [simTime]);

  // 일정 트리거
  useEffect(() => {
    SCHEDULE.forEach(evt => {
      if (simTime >= evt.time && !triggeredRef.current.has(evt.id)) {
        triggeredRef.current.add(evt.id);
        handleEvent(evt);
      }
    });
  }, [simTime, handleEvent]);

  const handleReset = () => {
    setIsRunning(false);
    setSimTime(540);
    setAgentStates(initialAgentStates());
    setLogs([]);
    setMeeting(null);
    setProject({ name: projectName, stage: null, outputs: {} });
    setSelectedAgentId(null);
    triggeredRef.current = new Set();
  };

  const started = triggeredRef.current.has('arrival');
  const selectedAgent = selectedAgentId ? AGENT_BY_ID[selectedAgentId] : null;

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 pb-10">
      <div className="max-w-7xl mx-auto px-4 pt-6">
        {/* 헤더 */}
        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div>
            <h1 className="text-xl font-bold text-white">🏙️ AI 메타버스 오피스 시뮬레이터</h1>
            <p className="text-xs text-slate-500 mt-1">12명의 AI 에이전트가 하루 동안 프로젝트를 함께 진행합니다.</p>
          </div>
          <div className="flex items-center gap-2">
            <input
              value={projectName}
              disabled={started}
              onChange={e => { setProjectName(e.target.value); setProject(p => ({ ...p, name: e.target.value })); }}
              className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white w-56 disabled:opacity-50"
              placeholder="프로젝트 이름"
            />
            <button onClick={loadRealReport} disabled={realReportLoading}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:opacity-90 disabled:opacity-50">
              {realReportLoading ? '📡 불러오는 중...' : '📡 오늘의 실제 리포트 불러오기'}
            </button>
            <button onClick={() => setShowApiKeyInput(v => !v)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${apiKey ? 'bg-emerald-700 text-white' : 'bg-slate-800 text-slate-300'} hover:opacity-90`}>
              {apiKey ? '🔑 API 연결됨' : '🔑 Claude API 키 설정'}
            </button>
          </div>
        </div>

        {realReportError && (
          <div className="mb-4 rounded-xl border border-amber-800/60 bg-amber-950/10 p-3 text-xs text-amber-300 flex items-center justify-between">
            <span>⚠️ {realReportError}</span>
            <button onClick={() => setRealReportError(null)} className="text-amber-500 hover:text-amber-300">✕</button>
          </div>
        )}
        <RealReportPanel report={realReport} onClose={() => setRealReport(null)} />

        {showApiKeyInput && (
          <div className="mb-4 rounded-xl border border-slate-800 bg-slate-900/60 p-4">
            <div className="text-sm font-semibold text-white mb-1">Claude API 키 (선택사항)</div>
            <p className="text-[11px] text-slate-500 mb-2 leading-relaxed">
              키를 입력하면 회의 대화와 업무 결과물이 Claude Opus 5로 실시간 생성됩니다. 비워두면 미리 준비된 템플릿으로 동작합니다.
              ⚠️ 이 키는 브라우저에서 Anthropic API로 직접 전송되며(<code>anthropic-dangerous-direct-browser-access</code>), 로컬 저장소에 저장됩니다.
              개인용 데모 목적으로만 사용하고, 공개 배포 시에는 절대 사용하지 마세요.
            </p>
            <div className="flex gap-2">
              <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)}
                     placeholder="sk-ant-..." className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" />
              <button onClick={() => { setApiKey(''); localStorage.removeItem('office_sim_api_key'); }}
                      className="px-3 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300">키 삭제</button>
            </div>
          </div>
        )}

        {/* 본문 */}
        <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,860px)_1fr] gap-4 items-start">
          <div className="space-y-4">
            <OfficeMap agentStates={agentStates} selectedAgentId={selectedAgentId} onSelectAgent={id => setSelectedAgentId(id === selectedAgentId ? null : id)} />
            <TimelinePanel simTime={simTime} isRunning={isRunning} speed={speed}
                           onToggleRun={() => setIsRunning(r => !r)} onSpeedChange={setSpeed} onReset={handleReset} />
          </div>

          <div className="space-y-4 min-w-0">
            {selectedAgent && (
              <AgentInfoPanel agent={selectedAgent} state={agentStates[selectedAgent.id]} logs={logs} onClose={() => setSelectedAgentId(null)} />
            )}
            <MeetingPanel meeting={meeting} />
            <ProjectPanel project={project} />
            <ActivityLog logs={logs} />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  // Babel Standalone's default auto-scan uses the automatic JSX runtime
  // (imports "react/jsx-runtime"), which fails in a plain <script> context.
  // Transform manually with the classic runtime instead.
  (function () {
    var source = document.getElementById('app-source').textContent;
    var compiled = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]],
    }).code;
    var script = document.createElement('script');
    script.textContent = compiled;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
