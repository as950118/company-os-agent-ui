name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Classic API token auth. Create a PyPI API token
        # (https://pypi.org/manage/account/token/ — use an
        # "entire account" scoped token for the first publish, since the
        # project doesn't exist on PyPI yet) and store it as the
        # PYPI_API_TOKEN secret on the "pypi" GitHub Environment.
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
